openapi: 3.1.0
info:
  title: Patenli Ayakkabılar API
  version: 1.0.0
  description: Patenli Ayakkabılar® resmi e-ticaret ve AI shopping API servisi.
servers:
  - url: https://patenliayakkabilar.com/api
    description: Production API Server
paths:
  /products:
    get:
      operationId: listProducts
      summary: Ürünleri Listele
      description: Sistemdeki tüm aktif ürünleri ilişkili kategori, varyant ve resim bilgileriyle birlikte sayfalanmış olarak getirir.
      parameters:
        - in: query
          name: category_id
          schema:
            type: integer
          required: false
          description: Belirli bir kategoriye ait ürünleri filtrelemek için kullanılır.
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          required: false
          description: Sayfa başına döndürülecek kayıt sayısı.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          required: false
          description: Sayfa numarası.
      responses:
        '200':
          description: Başarılı liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /products/{identifier}:
    get:
      operationId: getProduct
      summary: Ürün Detayı Getir
      description: ID veya URL Slug değerine göre tek bir ürünün tüm detaylarını getirir.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
          description: Ürünün ID numarası veya benzersiz URL slug değeri.
      responses:
        '200':
          description: Başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Ürün Bulunamadı

  /v1/ai/shopping/products:
    get:
      operationId: searchAiProducts
      summary: AI Alışveriş Ürün Kataloğu
      description: ChatGPT, Perplexity ve Gemini shopping botları için optimize edilmiş ürün listesini döndürür.
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Arama kelimesi veya modeli (ör. ışıklı, 4 tekerlekli, pembe)
        - in: query
          name: gender
          schema:
            type: string
            enum: [erkek_cocuk, kiz_cocuk, unisex]
          description: Cinsiyet veya hedef kitle
        - in: query
          name: in_stock_only
          schema:
            type: boolean
          description: Sadece stokta olanları getir
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Başarılı AI ürün listesi

  /v1/ai/shopping/product/{slug}:
    get:
      operationId: getAiProductDetails
      summary: AI Ürün Detayı ve SSS
      description: Belirli bir ürünün teknik özellikleri, fiyatı, kargo, SSS ve AI özetini getirir.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          description: Ürünün benzersiz slug değeri
      responses:
        '200':
          description: Başarılı ürün detayı

  /v1/ai/embeddings:
    get:
      operationId: getVectorEmbeddings
      summary: Vektör Gömme Veri Seti
      description: LLM ve vektör arama motorları için hazırlanmış metin parçaları ve metadata veri seti.
      responses:
        '200':
          description: Başarılı vektör veri seti

  /search/suggest:
    get:
      operationId: searchSuggestions
      summary: Anlık Arama ve Öneri Motoru
      description: Kullanıcı yazarken anlık popüler tamamlama, kategori ve ürün eşleşmelerini getirir.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Arama terimi
      responses:
        '200':
          description: Başarılı öneri listesi

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Işıklı Tekerlekli Paten Ayakkabı
        slug:
          type: string
          example: isikli-tekerlekli-paten-ayakkabi
        price:
          type: number
          format: float
          example: 1299.90
        discount_price:
          type: number
          format: float
          example: 999.90
        is_active:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              example: Çocuk Patenleri
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              sku:
                type: string
                example: ISK-PTN-01
              color:
                type: array
                items:
                  type: string
                example: ["Pembe", "Beyaz"]
              size:
                type: string
                example: "32"
              price:
                type: number
                format: float
              stock:
                type: integer
                example: 50
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              image_path:
                type: string
                example: uploads/products/image1.jpg
