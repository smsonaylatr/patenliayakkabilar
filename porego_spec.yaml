openapi: 3.1.0
info:
  title: Porego Merchant API
  version: "1.0.0"
  description: |
    Porego Merchant API ile sipariş oluşturabilir, sorgulayabilir, listeleyebilir,
    iptal edebilir ve kargo etiketini indirebilirsiniz. Sipariş ve kargo durumu
    değişikliklerini ise **webhook** ile anlık olarak alırsınız.

    ### Hızlı başlangıç
    1. **API anahtarı oluşturun** — Porego panelinde **Entegrasyonlar → API** sekmesine gidin.
    2. **Bağlantı testi yapın** — `GET /connection-test` çağırın.
    3. **İlk siparişinizi oluşturun** — `POST /orders` ile sipariş gönderin.
    4. **Webhook ayarlayın** — durum değişikliklerinden anlık haberdar olun.

    ### Temel bilgiler
    | | |
    |---|---|
    | Protokol | HTTPS (zorunlu) |
    | Format | JSON — `Content-Type: application/json` |
    | Karakter kodlama | UTF-8 |
    | Rate limit | 60 istek / dakika (API anahtarı başına) |

    Rate limit aşıldığında `429 Too Many Requests` döner; `Retry-After` header'ı kaç saniye
    sonra tekrar deneyebileceğinizi belirtir.

    ### Kargo takibi: hangi numara ne anlama geliyor?
    | Alan | Ne zaman dolar | Ne işe yarar |
    |---|---|---|
    | `trackingNumber` | Kargo oluşturulduğu anda | Porego takip numarası — tüm sorgular bununla yapılır |
    | `trackingUrl` | Kargo oluşturulduğu anda | `https://app.porego.com/tracking/{trackingNumber}` — ilk andan itibaren çalışan takip sayfası |
    | `carrierReference` | Kargo oluşturulduğu anda | Kargo firmasına ilettiğimiz referans kod (`330...`) |
    | `carrierTrackingNumber` | **Paket şubede ilk okutulduğunda** | Kargo firmasının kendi takip numarası |
    | `carrierTrackingUrl` | **Paket şubede ilk okutulduğunda** | Kargo firmasının kendi takip sayfası linki |

    > **Önemli:** Aras, MNG/DHL gibi firmalarda kargo firmasının kendi takip numarası, paket
    > şubede ilk kez okutulduğunda oluşur — kargo oluşturma anında bu numara henüz **yoktur**.
    > Bu yüzden `carrierTrackingNumber` / `carrierTrackingUrl` bir süre `null` döner. Müşterinize
    > ilk andan itibaren `trackingUrl` sayfasını gösterin; `SHIPMENT_STATUS_CHANGED` webhook'u ile
    > kargo firmasının numarası geldiğinde dilerseniz doğrudan firmanın linkine geçin.

    `platformCargoTrackingNumber`, `platformCargoCompany` ve `platformShipmentPackageId` alanları
    **yalnızca pazaryeri (Trendyol, Hepsiburada) siparişlerinde** doludur; bu API ile açtığınız
    kendi-site siparişlerinizde kargoyu Porego oluşturduğu için her zaman `null` dönerler.
  contact:
    name: Porego Destek
    email: hello@porego.com
    url: https://porego.com
  license:
    name: Porego Yazılım A.Ş.

servers:
  - url: https://back.porego.com/depokargo/api/v1/merchant-api/v1
    description: Production

security:
  - ApiKey: []
    ApiSecret: []

tags:
  - name: Kimlik Doğrulama
    description: API anahtarınızın geçerliliğini doğrulayın.
  - name: Siparişler
    description: Sipariş oluşturma, sorgulama, listeleme, iptal ve etiket.
  - name: Webhook
    description: Webhook URL'inizi kaydedin; olayları imzalı POST ile alın.

paths:
  /connection-test:
    get:
      tags: [Kimlik Doğrulama]
      summary: Bağlantı testi
      description: |
        API anahtarınızın geçerli olup olmadığını doğrular ve mağazanızın temel
        bilgilerini döner. Entegrasyonunuzu kurarken ilk çağrılacak endpoint budur.
      operationId: connectionTest
      responses:
        "200":
          description: Anahtar geçerli
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResponse"
              example:
                status: ok
                storeId: 123
                storeDomain: example.com
                platform: API
                webhookActive: false
                webhookUrl: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /orders:
    post:
      tags: [Siparişler]
      summary: Sipariş oluştur
      description: |
        Yeni bir sipariş oluşturur. Başarılı istek `200 OK` ile sipariş detaylarını döner.
        Oluşturulan siparişin `orderNumber` değerini saklayın — sonraki sorgu, iptal ve
        etiket işlemlerinde bu değer kullanılır.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              customerName: Ahmet
              customerSurname: Yılmaz
              customerPhone: "5551234567"
              customerEmail: ahmet@example.com
              address: Atatürk Cad. No:42 Kadıköy
              city: İstanbul
              district: Kadıköy
              neighbourhood: Caferağa
              paymentType: PREPAID
              totalWeight: 2.5
              totalDeci: 3.0
              items:
                - sku: SKU001
                  name: Ürün A
                  quantity: 1
                  price: 99.90
              platformOrderId: EXT-12345
      responses:
        "200":
          description: Sipariş oluşturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      tags: [Siparişler]
      summary: Siparişleri listele
      description: Siparişleri sayfalanmış olarak listeler. En yeni siparişler başta gelir.
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          description: "Durum filtresi"
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: page
          in: query
          required: false
          description: "Sayfa numarası (0'dan başlar)"
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: "Sayfa başına kayıt (maksimum 100)"
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        "200":
          description: Sipariş listesi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /orders/{orderNumber}:
    get:
      tags: [Siparişler]
      summary: Sipariş sorgula
      description: |
        Belirli bir siparişi `orderNumber` ile sorgular. Sipariş kargoya verilmişse yanıt
        kargo firması bilgilerini (`carrierName`, `carrierCode`, `carrierReference`) ve —
        paket şubede okutulduysa — firmanın kendi takip numarasını/linkini
        (`carrierTrackingNumber`, `carrierTrackingUrl`) da içerir.
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Sipariş detayı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /orders/{orderNumber}/cancel:
    put:
      tags: [Siparişler]
      summary: Sipariş iptal
      description: |
        Siparişi iptal eder. Yalnızca **NEW** ve **READY** durumundaki siparişler iptal
        edilebilir. Kargoya verilmiş (SHIPPED, IN_TRANSIT, COMPLETED) siparişler iptal edilemez.
      operationId: cancelOrder
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Sipariş iptal edildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Sipariş iptal edilemez durumda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ORDER_NOT_CANCELLABLE
                message: Kargoya verilmiş sipariş iptal edilemez
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /orders/{orderNumber}/label:
    get:
      tags: [Siparişler]
      summary: Sipariş etiketi (barkod)
      description: |
        Siparişe ait kargo etiketini taşıyıcıdan alıp **base64 kodlu PDF** olarak döner.
        Yazdırmak için `base64Pdf` alanını çözüp `.pdf` olarak kaydedin. Etiket yalnızca
        sipariş kargoya verildikten (bir takip numarası oluştuktan) sonra hazırdır.
      operationId: getOrderLabel
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Etiket hazır
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelResponse"
              example:
                trackingNo: "6917412814922"
                carrier: Sürat Kargo
                format: pdf
                base64Pdf: JVBERi0xLjQKJeLjz9MK...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Etiket henüz hazır değil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LABEL_NOT_READY
                message: Bu sipariş için henüz kargo/etiket oluşturulmamış
        "429":
          $ref: "#/components/responses/RateLimited"

  /register-webhook:
    post:
      tags: [Webhook]
      summary: Webhook kaydet
      description: |
        Sipariş ve kargo olaylarının gönderileceği webhook URL'inizi kaydeder. Yanıtta dönen
        `webhookSecret` değeri ile gelen isteklerin imzasını (`X-Porego-Signature`) doğrularsınız.
        Webhook URL'iniz HTTPS olmalıdır.
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
            example:
              webhookUrl: https://example.com/porego-webhook
              platform: WooCommerce
              siteUrl: https://example.com
              pluginVersion: "1.0.0"
      responses:
        "200":
          description: Webhook kaydedildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterWebhookResponse"
              example:
                status: ok
                storeId: 123
                storeDomain: example.com
                webhookUrl: https://example.com/porego-webhook
                webhookSecret: whsec_abc123...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

webhooks:
  orderStatusChanged:
    post:
      summary: Sipariş durumu değişti
      description: |
        Sipariş durumu değiştiğinde, kayıtlı webhook URL'inize bu gövde ile `POST` isteği
        gönderilir. İsteği işlemeden önce `X-Porego-Signature` imzasını doğrulayın ve
        5 saniye içinde `200` dönün. Başarısız istekler otomatik yeniden denenir.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              event: ORDER_STATUS_CHANGED
              timestamp: 2025-02-22T14:30:00Z
              data:
                orderNumber: API7401500123042
                platformOrderId: EXT-12345
                previousStatus: NEW
                currentStatus: READY
                trackingNumber: null
                trackingUrl: null
                carrierName: null
                carrierCode: null
                carrierReference: null
                carrierTrackingNumber: null
                carrierTrackingUrl: null
      responses:
        "200":
          description: Olay alındı
  shipmentStatusChanged:
    post:
      summary: Kargo durumu değişti
      description: |
        Kargo durumu değiştiğinde gönderilir. Gövde şeması sipariş olayıyla aynıdır;
        `event` alanı `SHIPMENT_STATUS_CHANGED` olur ve takip bilgileri dolu gelir.

        `carrierTrackingNumber` / `carrierTrackingUrl` alanları, paket şubede ilk kez
        okutulduğunda (genellikle `IN_TRANSIT` olayıyla birlikte) dolar. Müşterinize kargo
        firmasının kendi takip linkini göstermek istiyorsanız, bu alanların dolu geldiği
        ilk olayı bekleyin; öncesinde `trackingUrl` sayfasını kullanın.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
            example:
              event: SHIPMENT_STATUS_CHANGED
              timestamp: 2025-02-22T16:45:00Z
              data:
                orderNumber: API7401500123042
                platformOrderId: EXT-12345
                previousStatus: CREATED
                currentStatus: IN_TRANSIT
                trackingNumber: "6917412814923"
                trackingUrl: https://app.porego.com/tracking/6917412814923
                carrierName: Aras Kargo
                carrierCode: ARAS
                carrierReference: "3307401500123042"
                carrierTrackingNumber: "48170210250573"
                carrierTrackingUrl: https://kargotakip.araskargo.com.tr/mainpage.aspx?code=48170210250573
      responses:
        "200":
          description: Olay alındı

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "`pk_` ile başlayan açık anahtar."
    ApiSecret:
      type: apiKey
      in: header
      name: X-Api-Secret
      description: "`sk_` ile başlayan gizli anahtar. Asla istemci tarafında saklamayın."

  parameters:
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Sipariş oluşturmada dönen `orderNumber` değeri.
      schema:
        type: string
        examples: ["API7401500123042"]

  responses:
    BadRequest:
      description: Geçersiz istek (eksik/hatalı parametre)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_ERROR
            message: customerName is required
    Unauthorized:
      description: API Key veya Secret geçersiz ya da eksik
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_API_KEY
            message: Invalid API credentials
    NotFound:
      description: Sipariş bulunamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Sipariş bulunamadı
    RateLimited:
      description: Rate limit aşıldı
      headers:
        Retry-After:
          description: Tekrar denemeden önce beklenecek saniye
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: MERCHANT_API_RATE_LIMIT_EXCEEDED
            message: Rate limit exceeded. Retry after 30 seconds

  schemas:
    OrderStatus:
      type: string
      description: Sipariş durumu
      enum: [NEW, READY, SHIPPED, IN_TRANSIT, COMPLETED, CANCELLED]
      x-enum-descriptions:
        NEW: Sipariş oluşturuldu, henüz işlenmedi
        READY: Paketlendi, kargoya verilecek
        SHIPPED: Kargo firmasına teslim edildi
        IN_TRANSIT: Kargo dağıtımda, teslim edilecek
        COMPLETED: Alıcıya teslim edildi
        CANCELLED: Sipariş iptal edildi

    PaymentType:
      type: string
      enum: [PREPAID, COD]
      description: "`PREPAID` (ön ödemeli) veya `COD` (kapıda ödeme)"

    OrderItem:
      type: object
      properties:
        sku:
          type: string
          description: Stok kodu
        name:
          type: string
          description: Ürün adı
        quantity:
          type: integer
          description: Adet
        price:
          type: number
          description: Birim fiyat

    CreateOrderRequest:
      type: object
      required: [customerName, customerSurname, customerPhone, address, city, district, paymentType]
      properties:
        customerName:
          type: string
          description: Müşteri adı
        customerSurname:
          type: string
          description: Müşteri soyadı
        customerPhone:
          type: string
          description: "Telefon (örnek: 5551234567)"
        customerEmail:
          type: string
          format: email
          description: E-posta adresi
        address:
          type: string
          description: Teslimat adresi
        city:
          type: string
          description: "Şehir (örnek: İstanbul)"
        district:
          type: string
          description: "İlçe (örnek: Kadıköy)"
        neighbourhood:
          type: string
          description: Mahalle
        postalCode:
          type: string
          description: Posta kodu
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        codAmount:
          type: number
          description: Kapıda ödeme tutarı (paymentType=COD ise zorunlu)
        totalWeight:
          type: number
          description: Toplam ağırlık (kg)
        totalDeci:
          type: number
          description: Toplam desi (hacimsel ağırlık). Gönderilmezse ürün SKU'larından otomatik hesaplanır.
        items:
          type: array
          description: Ürün listesi
          items:
            $ref: "#/components/schemas/OrderItem"
        platformOrderId:
          type: string
          description: Sizin sisteminizdeki sipariş ID
        platformOrderNumber:
          type: string
          description: Sizin sisteminizdeki sipariş no
        notes:
          type: string
          description: Sipariş notu

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
          description: Porego tarafından üretilen sipariş numarası
        platformOrderId:
          type: string
        platformOrderNumber:
          type: string
        platformCargoTrackingNumber:
          type: string
          nullable: true
          description: |
            YALNIZCA pazaryeri (Trendyol, Hepsiburada) siparişlerinde dolu — pazaryerinin
            atadığı kargo barkodu. Merchant API ile açılan kendi-site siparişlerinde her
            zaman `null` döner; kargo firması bilgisi için `carrier*` alanlarını kullanın.
        platformCargoCompany:
          type: string
          nullable: true
          description: YALNIZCA pazaryeri siparişlerinde dolu — pazaryerinin atadığı kargo firması.
        platformShipmentPackageId:
          type: integer
          format: int64
          nullable: true
          description: YALNIZCA pazaryeri siparişlerinde dolu — pazaryerinin paket ID'si.
        status:
          $ref: "#/components/schemas/OrderStatus"
        customerName:
          type: string
        customerSurname:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: string
        address:
          type: string
        city:
          type: string
        district:
          type: string
        trackingNumber:
          type: string
          nullable: true
          description: Porego takip numarası. Kargo oluşturulduğu anda dolar.
        trackingUrl:
          type: string
          nullable: true
          description: "Takip linki: https://app.porego.com/tracking/{trackingNumber}. Kargo oluşturulduğu anda çalışır."
        carrierName:
          type: string
          nullable: true
          description: Kargo firmasının adı (ör. Aras Kargo, Sürat Kargo, DHL).
        carrierCode:
          type: string
          nullable: true
          description: Kargo firması kodu (ARAS, SURAT, HEPSIJET, DHL, ...).
        carrierReference:
          type: string
          nullable: true
          description: "Kargo firmasına ilettiğimiz referans kod (330... ile başlar). Etiket ve sorgular bu kodla yürür."
        carrierTrackingNumber:
          type: string
          nullable: true
          description: |
            Kargo firmasının KENDİ takip numarası. Paket şubede ilk kez okutulduğunda oluşur;
            o ana kadar `null` döner (kargo oluşturma anında bu numara henüz mevcut değildir).
        carrierTrackingUrl:
          type: string
          nullable: true
          description: |
            Kargo firmasının kendi takip sayfası linki (ör. `https://kargotakip.dhlecommerce.com.tr/...`).
            `carrierTrackingNumber` ile aynı anda dolar.
        paymentType:
          $ref: "#/components/schemas/PaymentType"
        codAmount:
          type: number
        totalWeight:
          type: number
        totalDeci:
          type: number
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 456
        orderNumber: API7401500123042
        platformOrderId: EXT-12345
        platformOrderNumber: "#1001"
        status: SHIPPED
        customerName: Ahmet
        customerSurname: Yılmaz
        customerPhone: "5551234567"
        customerEmail: ahmet@example.com
        address: Atatürk Cad. No:42 Kadıköy
        city: İstanbul
        district: Kadıköy
        platformCargoTrackingNumber: null
        platformCargoCompany: null
        platformShipmentPackageId: null
        trackingNumber: "6917412814923"
        trackingUrl: https://app.porego.com/tracking/6917412814923
        carrierName: Aras Kargo
        carrierCode: ARAS
        carrierReference: "3307401500123042"
        carrierTrackingNumber: "48170210250573"
        carrierTrackingUrl: https://kargotakip.araskargo.com.tr/mainpage.aspx?code=48170210250573
        paymentType: PREPAID
        codAmount: null
        totalWeight: 2.5
        totalDeci: 3.0
        notes: null
        createdAt: 2025-02-22T14:30:00Z
        updatedAt: 2025-02-22T16:45:00Z

    OrderPage:
      type: object
      description: Spring Data sayfa yapısı
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
          description: Geçerli sayfa (0'dan başlar)
        first:
          type: boolean
        last:
          type: boolean

    LabelResponse:
      type: object
      properties:
        trackingNo:
          type: string
          description: Kargo takip numarası
        carrier:
          type: string
          description: Kargo firması
        format:
          type: string
          description: Etiket formatı (pdf)
        base64Pdf:
          type: string
          description: Base64 kodlu PDF etiket içeriği

    ConnectionTestResponse:
      type: object
      properties:
        status:
          type: string
        storeId:
          type: integer
          format: int64
        storeDomain:
          type: string
        platform:
          type: string
        webhookActive:
          type: boolean
        webhookUrl:
          type: string

    RegisterWebhookRequest:
      type: object
      required: [webhookUrl]
      properties:
        webhookUrl:
          type: string
          format: uri
          description: Olayların gönderileceği HTTPS endpoint
        platform:
          type: string
          description: Platform türü (örn. WooCommerce)
        siteUrl:
          type: string
          description: Site URL (loglama için)
        pluginVersion:
          type: string
        wordpressVersion:
          type: string
        woocommerceVersion:
          type: string

    RegisterWebhookResponse:
      type: object
      properties:
        status:
          type: string
        storeId:
          type: integer
          format: int64
        storeDomain:
          type: string
        webhookUrl:
          type: string
        webhookSecret:
          type: string
          description: HMAC-SHA256 imza doğrulaması için gizli anahtar

    WebhookEvent:
      type: object
      properties:
        event:
          type: string
          enum: [ORDER_STATUS_CHANGED, SHIPMENT_STATUS_CHANGED]
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          description: |
            Olay gövdesi. Aşağıdaki alanlara ek olarak sipariş/müşteri bilgileri de gönderilir;
            bilmediğiniz alanları yok sayabilirsiniz (ileriye dönük yeni alanlar eklenebilir).
          properties:
            orderNumber:
              type: string
            platformOrderId:
              type: string
            previousStatus:
              type: string
            currentStatus:
              type: string
            trackingNumber:
              type: string
              nullable: true
              description: Porego takip numarası.
            trackingUrl:
              type: string
              nullable: true
              description: "https://app.porego.com/tracking/{trackingNumber}"
            carrierName:
              type: string
              nullable: true
              description: Kargo firmasının adı.
            carrierCode:
              type: string
              nullable: true
              description: Kargo firması kodu (ARAS, SURAT, HEPSIJET, DHL, ...).
            carrierReference:
              type: string
              nullable: true
              description: "Kargo firmasına ilettiğimiz referans kod (330... ile başlar)."
            carrierTrackingNumber:
              type: string
              nullable: true
              description: |
                Kargo firmasının kendi takip numarası. Paket şubede ilk okutulduğunda dolar —
                bu alanın dolu geldiği ilk olay, firmanın takip linkine geçebileceğiniz andır.
            carrierTrackingUrl:
              type: string
              nullable: true
              description: Kargo firmasının kendi takip sayfası linki.

    Error:
      type: object
      properties:
        code:
          type: string
          description: Makine-okur hata kodu
        message:
          type: string
          description: Açıklayıcı hata mesajı
